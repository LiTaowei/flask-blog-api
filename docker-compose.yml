services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: flask-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_db}
      MYSQL_USER: ${MYSQL_USER:-blog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: flask-blog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-jwt-secret}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-blog_user}:${MYSQL_PASSWORD:-blog_password}@db:3306/${MYSQL_DATABASE:-blog_db}?charset=utf8mb4
    ports:
      - "${WEB_PORT:-5000}:5000"

volumes:
  mysql_data:
